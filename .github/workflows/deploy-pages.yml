name: Deploy to GitHub Pages

# The site is statically exported, so the Google Sheet is read at build time.
# A scheduled rebuild keeps the published schedule in sync with the sheet
# without anyone having to press a button.
on:
  push:
    branches: [main]
  schedule:
    # Every 6 hours. Times are UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer run finish instead.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate event data
        run: npm run data:validate

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Build static site
        env:
          # Repository variables (Settings → Secrets and variables → Actions).
          GITHUB_PAGES_BASE_PATH: ${{ vars.GITHUB_PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          # NEXT_PUBLIC_ so the same URL is available to the browser, which
          # refetches the sheet on every page load.
          NEXT_PUBLIC_GOOGLE_SHEET_CSV_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_CSV_URL }}
          NEXT_PUBLIC_GOOGLE_SHEET_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_ID }}
          NEXT_PUBLIC_GOOGLE_SHEET_NAME: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_NAME }}
          NEXT_PUBLIC_GOOGLE_SHEET_GID: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_GID }}
          NEXT_PUBLIC_REGISTRATION_ENDPOINT: ${{ vars.NEXT_PUBLIC_REGISTRATION_ENDPOINT }}
          NEXT_PUBLIC_REGISTRATION_SECRET: ${{ secrets.NEXT_PUBLIC_REGISTRATION_SECRET }}
        run: npm run build:static

      - name: Verify export
        env:
          GITHUB_PAGES_BASE_PATH: ${{ vars.GITHUB_PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
        run: npm run verify:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

